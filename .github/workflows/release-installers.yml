name: release-installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install WiX Toolset v3
        shell: pwsh
        run: choco install wixtoolset --no-progress -y
      - name: Build MSI
        shell: pwsh
        run: ./scripts/release/windows-msi.ps1
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-msi
          path: target/wix/*.msi
          if-no-files-found: warn

  macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Build DMG
        run: ./scripts/release/macos-dmg.sh
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-dmg
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  linux-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install appimage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 patchelf desktop-file-utils pkg-config libdbus-1-dev
      - name: Install appimagetool
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool.AppImage
          sudo tee /usr/local/bin/appimagetool >/dev/null <<'EOF'
          #!/usr/bin/env bash
          exec /usr/local/bin/appimagetool.AppImage --appimage-extract-and-run "$@"
          EOF
          sudo chmod +x /usr/local/bin/appimagetool
      - name: Build AppImage and DEB
        run: ./scripts/release/linux-packages.sh
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-appimage
          path: target/**/*.AppImage
          if-no-files-found: warn
      - name: Upload DEB
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-deb
          path: target/debian/*.deb
          if-no-files-found: warn

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-msi, macos-dmg, linux-packages]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List artifacts
        run: find release-artifacts -type f -maxdepth 4 -print

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.msi
            release-artifacts/**/*.dmg
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
