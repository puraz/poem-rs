[package]
name = "poem-rs"
version = "0.1.18"
edition = "2024"
description = "A Rust + iced desktop poetry app."
readme = "README.md"

[dependencies]
anyhow = "1.0.102"
directories = "6.0.0"
iced = { version = "0.14.0", features = ["image", "tokio", "svg"] }
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
libc = "0.2.185"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }

[package.metadata.bundle]
name = "poem-rs"
identifier = "com.poemrs.desktop"
short_description = "Desktop poetry library and AI-assisted appreciation."
long_description = """
poem-rs is a Rust + iced desktop app for local poetry reading, collection,
editing, and AI-assisted discovery/appreciation.
"""
category = "Education"
icon = [
  "assets/icons/app.png",
  "assets/icons/app.icns",
  "assets/icons/app.ico",
]

[package.metadata.deb]
maintainer = "poem-rs maintainers"
depends = "$auto"
section = "utils"
priority = "optional"
extended-description = """
poem-rs is a desktop poetry application built with Rust and iced.
It supports local search, favorites, editing, and AI-assisted poem workflows.
"""
assets = [
  ["packaging/linux/poem-rs.desktop", "usr/share/applications/poem-rs.desktop", "644"],
  ["assets/icons/app.png", "usr/share/icons/hicolor/512x512/apps/poem-rs.png", "644"],
]

[package.metadata.appimage]
desktop_entry = "packaging/linux/poem-rs.desktop"
icon = "assets/icons/app.png"

[build-dependencies]
winres = "0.1.12"
